# Optional Render Blueprint for the static site.
services:
  - type: web
    name: campusflow-frontend
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false        # https://<your-backend>.onrender.com/api/v1
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
